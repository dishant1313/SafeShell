[project]
name = "safeshell"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402", "E722", "E741", "F841", "W291", "W293"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "root: tests that require root/CAP_SYS_ADMIN privileges",
    "integration: integration tests that require external services",
]
filterwarnings = [
    "ignore::DeprecationWarning:safeshell",
]

[project.scripts]
safeshell = "safeshell.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["safeshell*"]

[package]
name = "safeshell-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "safeshell-core"
path = "src/main.rs"

[dependencies]
nix = { version = "0.29", features = ["sched", "mount", "signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
